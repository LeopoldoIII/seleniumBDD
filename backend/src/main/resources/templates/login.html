<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installments App - Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 340px;
            border: 1px solid #334155;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 0.65rem;
            margin-top: 0.25rem;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1.5rem;
            border: none;
            border-radius: 6px;
            background: #0284c7;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        .alert {
            background: #ef4444;
            color: #fff;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Installments App</h2>
        <div class="subtitle">Spring Boot 3 + JWT Secured</div>

        <div id="errorMessage" class="alert" th:if="${errorMessage != null}" th:text="${errorMessage}">
            Error message placeholder
        </div>

        <form method="POST" action="/login" novalidate>
            <label for="username">Email Address</label>
            <input type="email" id="username" name="username" placeholder="testuser@example.com" th:value="${username}">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="testpassword">

            <button type="submit" id="loginButton">Sign In</button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed #334155; font-size: 0.75rem; color: #94a3b8;">
            <div style="font-weight: 600; color: #38bdf8; margin-bottom: 0.35rem;">Demo Credentials:</div>
            <div>&bull; <strong>User</strong>: <code>testuser@example.com</code> / <code>testpassword</code></div>
            <div>&bull; <strong>Admin</strong>: <code>admin@example.com</code> / <code>adminpassword123</code></div>
            <div>&bull; <strong>Auditor</strong>: <code>auditor@example.com</code> / <code>auditor123</code></div>
            <div style="margin-top: 0.35rem;">&bull; <strong>H2 Console</strong>: <code>db_user</code> / <code>db_password123</code></div>
        </div>
    </div>
</body>
</html>
